# One model per run: docker compose --env-file profiles/<profile>.env up -d
name: jev-brain
services:
  vllm:
    image: vllm/vllm-openai:v0.30.0@sha256:8a69ffad015f138d7170c4ddc429e230a3bc1c1719f67e14324749df200a4b90
    entrypoint: ["/bin/bash", "/opt/jev/vllm-entrypoint.sh"]
    # Not unless-stopped: a clean reboot must not grab ~86 GB of VRAM (a crash still restarts it).
    restart: on-failure:3
    ipc: host
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
    environment:
      HF_MODEL: ${HF_MODEL}
      HF_REVISION: ${HF_REVISION}
      SERVED_MODEL: ${SERVED_MODEL}
      MAX_MODEL_LEN: ${MAX_MODEL_LEN}
      MAX_NUM_SEQS: ${MAX_NUM_SEQS:-256}
      REASONING_PARSER: ${REASONING_PARSER}
      TOOL_PARSER: ${TOOL_PARSER}
      LANGUAGE_MODEL_ONLY: ${LANGUAGE_MODEL_ONLY:-0}
      CHAT_TEMPLATE: ${CHAT_TEMPLATE:-}
      CHAT_TEMPLATE_KWARGS: ${CHAT_TEMPLATE_KWARGS:-}
      EXTRA_ARGS: ${EXTRA_ARGS:-}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      HF_HUB_OFFLINE: "1"
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface:ro
      - ./docker/vllm-entrypoint.sh:/opt/jev/vllm-entrypoint.sh:ro
      # v0.30.0 rejection sampler + fix: label-id reads survive MTP batches (DS-004). Pinned to the image digest.
      - ./docker/vllm/rejection_sampler.py:/usr/local/lib/python3.12/dist-packages/vllm/v1/worker/gpu/spec_decode/rejection_sampler.py:ro
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 1800s

  gateway:
    build: {context: ., dockerfile: docker/gateway.Dockerfile}
    restart: on-failure:3
    environment:
      PROFILE: ${PROFILE}
      HF_MODEL: ${HF_MODEL}
      HF_REVISION: ${HF_REVISION}
      SERVED_MODEL: ${SERVED_MODEL}
      MAX_MODEL_LEN: ${MAX_MODEL_LEN}
      SYSTEMONE_MAX_LEN: ${SYSTEMONE_MAX_LEN:-}
      PROMPT_LAYOUT: ${PROMPT_LAYOUT:-decider_chat}
      OPTION_ORDERS: ${OPTION_ORDERS:-identity}
      PREFIX_PAD: ${PREFIX_PAD:-off}
      PREFIX_BLOCK: ${PREFIX_BLOCK:-0}
      PREFIX_PAD_ALWAYS: ${PREFIX_PAD_ALWAYS:-0}
      WARM_MIN_PREFIX_TOKENS: ${WARM_MIN_PREFIX_TOKENS:-512}
      WARM_UP: ${WARM_UP:-row}
      SYSTEMONE_PRIORITY: ${SYSTEMONE_PRIORITY:-0}
      GOVERNOR_DUTY: ${GOVERNOR_DUTY:-1.0}
      GOVERNOR_WAVE: ${GOVERNOR_WAVE:-4}
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      VLLM_URL: http://vllm:8000
      HF_HUB_OFFLINE: "1"
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface:ro
      - ./prompts:/app/prompts:ro
      - ./data:/app/data:ro
    ports: ["127.0.0.1:9000:9000"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s
    depends_on:
      vllm: {condition: service_healthy}
