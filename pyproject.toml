[project]
name = "jev-brain"
version = "0.1.0"
description = "One vLLM model serving OpenAI chat and a Jev-compatible /v1/systemone endpoint"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.9",
    "transformers>=5.0",
    "jinja2>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "typesafe-sdk==0.7.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["live: needs the running stack (docker compose up)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
target-version = "py312"
